[package]
name = "lsp"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "nyx-lsp"
path = "src/main.rs"

[dependencies]
frontend = { path = "../frontend" }
fmt = { path = "../fmt" }
bumpalo = "3"
self_cell = "1.3"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
expect-test = "1.5"
serde_json = "1"
